<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário HTML com Validação Básica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Formulário de Cadastro</h1>
        <form id="contato" action="sucesso.html" method="GET">
            <fieldset>
                <legend>Informações Pessoais</legend>
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                </div>
                
                <div class="form-group">
                    <label for="telefone">Telefone (Formato: 99-99999-9999):</label>
                    <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="41-99999-9999">
                </div>
                
                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento">
                </div>
                
                <div class="form-group">
                    <label for="idade">Idade (18 a 120 anos):</label>
                    <input type="number" id="idade" name="idade" min="18" max="120" placeholder="Ex: 25">
                </div>
            </fieldset>
            
            <fieldset>
                <legend>Preferências</legend>
                
                <div class="form-group inline-group">
                    <label for="cor">Cor Favorita:</label>
                    <input type="color" id="cor" name="cor">
                </div>
                
                <div class="form-group">
                    <label for="volume">Volume:</label>
                    <input type="range" id="volume" name="volume" min="0" max="100" value="50">
                </div>
            
                <datalist id="navegadores">
                    <option value="Chrome">
                    <option value="Firefox">
                    <option value="Safari">
                    <option value="Edge">
                </datalist>

                <div class="form-group">
                    <label for="navegador">Escolha seu navegador:</label>
                    <input list="navegadores" id="navegador" name="navegador" placeholder="Selecione ou digite">
                </div>

                <div class="form-group">
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto">
                        <option value="">--Selecione--</option>
                        <option value="duvida">Dúvida</option>
                        <option value="elogio">Elogio</option>
                        <option value="reclamacao">Reclamação</option>
                    </select>
                </div>

                <details>
                    <summary>Clique para ver mais informações</summary>
                    <p>Conteúdo adicional que aparece quando expandido.</p>
                </details>

                <div class="form-group">
                    <label class="group-title">Período de preferência:</label>
                    <div class="options-inline">
                        <label><input type="radio" id="pm" name="periodo"> Manhã</label>
                        <label><input type="radio" id="pt" name="periodo" checked> Tarde</label>
                        <label><input type="radio" id="pn" name="periodo"> Noite</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="group-title">Veículos usados para deslocamento:</label>
                    <div class="options-inline">
                        <label><input type="checkbox" id="carro" name="veiculo"> Carro</label>
                        <label><input type="checkbox" id="moto" name="veiculo"> Motoca</label>
                        <label><input type="checkbox" id="bike" name="veiculo" checked> Bicicleta</label>
                    </div>
                </div>
            </fieldset>

            <button type="submit">Enviar Formulário</button>
        </form>
    </div>
</body>
</html>
